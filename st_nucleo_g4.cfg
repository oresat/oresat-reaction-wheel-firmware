# This is for all ST NUCLEO with any STM32G4. Known boards at the moment:
# NUCLEO-G431KB
# https://www.st.com/en/evaluation-tools/nucleo-g431kb.html
# NUCLEO-G431RB
# https://www.st.com/en/evaluation-tools/nucleo-g431rb.html
# NUCLEO-G474RE
# https://www.st.com/en/evaluation-tools/nucleo-g474re.html
# NUCLEO-G491RE
# https://www.st.com/en/evaluation-tools/nucleo-g491re.html

source [find interface/stlink.cfg]

transport select swd

source [find target/stm32g4x.cfg]

reset_config srst_only

# --- Debugging CCM-resident hot code (optimized builds: Release / RelWithDebInfo) ---
# In non-Debug builds the HRTIM fast-loop path is placed in CCM SRAM at 0x10000000
# (see __ccmram / CCMRAM_HOT_FUNCS in typedefs.h + the .ccmram copy in startup). That
# code is shadowed from flash at boot, so GDB *software* breakpoints set in it get
# overwritten by the startup copy and silently never hit. Use *hardware* breakpoints
# instead: the Cortex-M4 FPB covers any address below 0x20000000, which includes CCM
# at 0x10000000 (this is why the linker keeps CCM there and not at the 0x2001_8000
# SRAM alias). Per breakpoint, use `hbreak <fn>` rather than `break <fn>`. To force
# every breakpoint to hardware for the whole session, uncomment the line below — leave
# it commented for the flash-resident Debug build, where only 6 FPB comparators exist
# and software breakpoints are unlimited.
gdb_breakpoint_override hard
