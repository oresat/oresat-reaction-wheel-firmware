# This is for all ST NUCLEO with any STM32G4. Known boards at the moment:
# NUCLEO-G431KB
# https://www.st.com/en/evaluation-tools/nucleo-g431kb.html
# NUCLEO-G431RB
# https://www.st.com/en/evaluation-tools/nucleo-g431rb.html
# NUCLEO-G474RE
# https://www.st.com/en/evaluation-tools/nucleo-g474re.html
# NUCLEO-G491RE
# https://www.st.com/en/evaluation-tools/nucleo-g491re.html

source [find interface/stlink.cfg]

# Released OpenOCD 0.12.0 ships interface/stlink.cfg on the deprecated 'hla'
# adapter driver, which only offers 'hla_swd'; git builds (0.12.0+dev) use the
# 'st-link' driver, which offers plain 'swd'. Support both.
if { [catch { transport select swd }] } {
	transport select hla_swd
}

source [find target/stm32g4x.cfg]

reset_config srst_only
